name: Sync mcp-task-hub

on:
  push:
    branches: [main]
    paths:
      - '.agents/skills/mcp-hub-setup/SKILL.md'
      - 'specs/mcp-task-hub/spec.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent-kit
        uses: actions/checkout@v4

      - name: Checkout mcp-task-hub
        uses: actions/checkout@v4
        with:
          repository: mdvacula/mcp-task-hub
          path: mcp-task-hub
          token: ${{ secrets.TEMPLATE_REPO_TOKEN }}

      - name: Install pi
        run: npm install -g @mariozechner/pi-coding-agent

      - name: Run mcp-hub-setup skill (Mode B)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        working-directory: mcp-task-hub
        run: |
          cat "${{ github.workspace }}/.agents/skills/mcp-hub-setup/SKILL.md" | \
          pi --provider openrouter \
             --model moonshotai/kimi-k2 \
             --no-session \
             -p "The above is the mcp-hub-setup skill. Execute MODE B exactly as specified.
          Source agent-kit is at: ${{ github.workspace }}
          Your working directory is the mcp-task-hub checkout.
          Triggering commit: ${{ github.sha }}
          Do NOT run docker compose or any interactive commands.
          Write all files, then stop — the PR step will commit.

          When you are done, write two files:
          1. /tmp/pr-title.txt — a single line, plain text PR title that describes what actually changed.
             Good example: 'fix(hub): correct aiosqlite connection lifecycle'
             Bad example:  'chore(hub): sync from agent-kit <sha>'
          2. /tmp/pr-body.md — a markdown PR body with:
             ## What changed
             - bullet list of the specific files added/updated and why
             ## Why
             one or two sentences explaining what this sync enables or fixes
             ## Source
             Triggered by commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

      - name: Read PR metadata
        id: pr
        run: |
          if [ -f /tmp/pr-title.txt ]; then
            echo "title=$(cat /tmp/pr-title.txt)" >> $GITHUB_OUTPUT
          else
            echo "title=chore(hub): sync from agent-kit ${{ github.sha }}" >> $GITHUB_OUTPUT
          fi
          if [ -f /tmp/pr-body.md ]; then
            {
              echo 'body<<PR_BODY_EOF'
              cat /tmp/pr-body.md
              echo 'PR_BODY_EOF'
            } >> $GITHUB_OUTPUT
          else
            {
              echo 'body<<PR_BODY_EOF'
              echo 'Automated sync from agent-kit.'
              echo ''
              echo "Source commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
              echo 'PR_BODY_EOF'
            } >> $GITHUB_OUTPUT
          fi

      - name: Open PR on mcp-task-hub
        uses: peter-evans/create-pull-request@v6
        with:
          path: mcp-task-hub
          token: ${{ secrets.TEMPLATE_REPO_TOKEN }}
          commit-message: "chore(hub): sync from agent-kit ${{ github.sha }}"
          branch: "sync/agent-kit-${{ github.sha }}"
          title: ${{ steps.pr.outputs.title }}
          body: ${{ steps.pr.outputs.body }}
